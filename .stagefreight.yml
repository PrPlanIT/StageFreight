version: 1

ci:
  # Runtime pull location: the docker.io pull-through mirror serving
  # docker.io/prplanit/stagefreight:latest-dev (where the narrate image lands).
  image: docker.cr.pcfae.com/prplanit/stagefreight:latest-dev

vars:
  org: prplanit
  github_org: PrPlanIT
  gitlab_group: PrPlanIT
  repo: stagefreight
  github_repo: StageFreight

git:                                     # interpret the ref → named branch/tag patterns + the versions they imply (was matchers + versioning)
  branches:
    main: "^main$"
  tags:                                  # id → {pattern} (was versioning.tag_sources)
    stable:     { pattern: "^v?\\d+\\.\\d+\\.\\d+$" }
    prerelease: { pattern: "^v?\\d+\\.\\d+\\.\\d+-.+" }
  versioning:                            # derivation rules that consume the patterns above
    branch_builds:
      default: { base_from: [stable], format: "{base}-dev+{sha}" }
    no_lineage: { mode: error }

builds:
  stagefreight:
    kind: docker
    build_mode: crucible
    platforms: [linux/amd64]

  # Reference docs are a build: generate them from THIS commit's binary, not a stale one.
  # stage recycles the freshly-built stagefreight-bin into the workspace as ./stagefreight
  # (same mechanism as a docker build's stage:), so docs reflect the CLI + config being
  # shipped — never the previous release's schema — with no recompile. No image is pinned:
  # kind: command defaults to ci.image, which is just the sandbox — we execute the staged
  # static binary, not whatever the image ships. `worktree: true` lands the tree at the
  # output's source path (docs/assets/modules) at the start of Narrate, where the narrator include
  # items assemble it into docs/reference; `{output}` names the path once. This is the
  # general shape any project uses: build your tool, stage it, run it.
  reference:
    kind: command
    stage:
      from: stagefreight-bin
      as: stagefreight
    command: [./stagefreight, docs, generate, --output-dir, "{output}"]
    outputs:
      - { type: tree, source: docs/assets/modules, worktree: true }

  stagefreight-bin:
    kind: binary
    builder: go
    from: ./src/cli
    output: stagefreight
    env: { CGO_ENABLED: "0" }
    # No -tags banner_art: the fancy ASCII banner needs a generated, gitignored
    # file (go generate ./src/output) that the Dockerfile produces but the binary
    # build can't. The stub gives a text banner. Version is embedded via ldflags so
    # downloaded binaries report the real version (not "dev").
    args:
      - "-ldflags"
      - "-s -w -X {project.module}/src/version.Version={version} -X {project.module}/src/version.Commit={sha} -X {project.module}/src/version.BuildDate={date}"
    platforms: [linux/amd64, linux/arm64]

  # Documentation site: build the MkDocs Material site from docs/ into a `site/` tree
  # that the `docs` pages target deploys. The mkdocs-material image ships an
  # ENTRYPOINT ["mkdocs"], which collides with the engine's `sh -c` invocation, so we
  # pip-install into a plain python image instead. Uses the committed, generated
  # reference under docs/reference + docs/assets/modules (kept fresh by the `reference` build).
  docs-site:
    kind: command
    image: docker.io/library/python:3.12-slim
    command: "pip install --quiet --root-user-action=ignore mkdocs-material && mkdocs build -f docs/assets/mkdocs/mkdocs.yml --strict --site-dir $(pwd)/site"
    outputs:
      - { type: tree, source: site }

forges:
  gitlab:
    provider: gitlab
    url: "https://gitlab.prplanit.com"
    credentials: GITLAB
    # {path.gitlab}/{path.github} resolve from these, so the shared stencils link at
    # this repo instead of rendering their tokens literally.
    default_path: "{org}/{repo}"

  github:
    provider: github
    url: "https://github.com"
    credentials: GITHUB
    default_path: "{org.github}/{repo}"

repos:
  primary:
    forge: gitlab
    project: "PrPlanIT/StageFreight"
    roles: [primary]
    branches:
      default: main
    worktree: "."

  github-mirror:
    forge: github
    project: "PrPlanIT/StageFreight"
    roles: [mirror, publish-origin]
    sync:                        # facet × scope (see 📦); faithful git mirror (releases NOT synced —
      branches: exact            # they're authored on github via the release publish target;
      tags: exact                # a repo gets releases via sync XOR a kind:release target, never both)

registries:
  dockerhub:
    provider: docker
    url: docker.io
    credentials: DOCKER
    default_path: "{org.docker}/{repo}"

  harbor:
    provider: harbor
    url: cr.pcfae.com
    credentials: HARBOR
    default_path: "{org.docker}/{repo}"

  # GitHub Container Registry. Path must be lowercase; {var:org}/{var:repo}
  # (prplanit/stagefreight) resolves under the PrPlanIT GitHub org.
  # Auth: GHCR_USER + GHCR_TOKEN (a PAT with write:packages) in CI.
  ghcr:
    provider: ghcr
    url: ghcr.io
    credentials: GHCR
    default_path: "{org.ghcr}/{repo}"

publish:                                 # distribute artifacts to their destinations (was targets:); id→target map
  # ── Stable releases → all registries (fans via registry: list) ───
  stable:
    kind: registry
    registry: [dockerhub, ghcr, harbor]
    build: stagefreight
    tags: ["v{version}", "latest"]
    when: { git_tags: [stable], events: [tag] }

  # ── Pre-releases (alpha/beta/rc) → Docker Hub + GHCR ─────────────
  prerelease:
    kind: registry
    registry: [dockerhub, ghcr]
    build: stagefreight
    tags: ["v{version}"]
    when: { git_tags: [prerelease], events: [tag] }

  # ── Dev builds on every commit → all registries (retained/pruned) ──
  dev:
    kind: registry
    registry: [dockerhub, ghcr, harbor]
    build: stagefreight
    tags: ["dev-{sha:8}", "latest-dev"]
    when: { branches: [main], events: [push] }
    retention:
      keep_last: 6   # latest-dev is rolling (no sequence var) → auto-exempt, no protect needed

  # ── Harbor: per-branch test builds (Harbor ONLY, never Docker Hub) ──
  # Every non-main branch push crucible-builds to Harbor so a protected branch
  # pipeline can point its CI image at the branch build and let the candidate
  # govern itself end-to-end before merge. The test-* / latest-test-* tag
  # namespace IS the throwaway channel — images carry no release/prerelease flag
  # (that is a forge-release concept, not an image one).
  harbor-test:
    kind: registry
    registry: harbor
    build: stagefreight
    tags: ["test-{branch}-{sha:8}", "latest-test-{branch}"]
    when: { branches: ["!main"], events: [push] }
    retention:
      keep_last: 6        # per-branch: 6 test builds kept for EACH branch (grouped by {branch})
      keep_branches: 10   # bound retired branches — keep the 10 most-recently-active; latest-test-{branch} is rolling per branch (auto-exempt)

  # ── Project identity: registries + forge repos ───────────────────
  project-meta:                          # project identity → registries + forge repos, one source of truth
    kind: metadata
    registry: [dockerhub, harbor]        # Docker Hub Overview + Harbor Info (long body); short description capped per vendor
    repos: [github-mirror, primary]      # GitHub (description/website/topics) + GitLab (description/topics)
    description:                          # length-tiered variants — the engine fits each destination's cap
      # full (~380) — GitLab & other generous caps
      - "A declarative lifecycle runtime that governs Git as the source of truth, enforcing operator-defined intent across GitOps workflows, Kubernetes, Docker, and CI ecosystems. StageFreight is open-source, self-building, and replaces fragile shell-script CI pipelines with a single Go binary driven by one .stagefreight.yml file. There's a setting for every stage — this is theatre."
      # mid (~265) — GitHub's ~350 cap
      - "A declarative lifecycle runtime that governs Git as the source of truth — GitOps, Kubernetes, Docker & CI from one .stagefreight.yml. Open-source, self-building; replaces fragile shell-script pipelines with a single Go binary. A setting for every stage — this is theatre."
      # short (~83) — Docker Hub's ~100 cap
      - "A declarative lifecycle runtime — GitOps, Kubernetes, Docker & CI from one manifest"
    readme: README.md                    # long markdown body where the destination has one
    website: https://stagefreight.prplanit.com
    topics: [ci-cd, gitops, kubernetes, docker, devops, lifecycle-runtime]
    when: { branches: [main], events: [push, tag] }

  # ── Binary archives: linux amd64/arm64 + SHA256SUMS ──────────────
  # ONE archive recipe, fired on EITHER trigger (when: is an OR-list of condition
  # sets) — {version} differentiates stable (1.2.3) from dev (1.2.3-dev+sha). Feeds
  # both release (stable tag) and dev-release (main push).
  stagefreight-binaries:
    kind: binary-archive
    build: stagefreight-bin
    name: "stagefreight-{version}-{os}-{arch}"
    format: auto
    checksums: true
    when:
      - { git_tags: [stable], events: [tag] }   # feeds release
      - { branches: [main], events: [push] }    # feeds dev-release

  # ── Stable release (gitlab + github) with rolling aliases + binaries ──
  # One target authors the release on BOTH forges. The rolling alias tags
  # (v{version}, latest) are created on the primary only; github receives those
  # tags via the git sync (tags: exact) and the release object via its repos:
  # entry — so the rolling tags are never double-managed.
  release:
    kind: release
    security_summary: true
    registry_links: true
    notes: release-notes
    type: latest
    repos: [primary, github-mirror]
    archives: stagefreight-binaries
    aliases: ["v{version}", "latest"]
    when: { git_tags: [stable], events: [tag] }

  # ── Dev binary release channel: rolling latest-dev + retained immutable
  #    dev-{sha8}, pruned like the docker dev images. Dogfoods the binary
  #    release-channel feature. Authored on BOTH the primary (gitlab) and the
  #    github mirror via kind:release — retention now prunes dev-{sha8} on the
  #    mirror too (release-target repos are retained), so it no longer accumulates.
  dev-release:
    kind: release
    security_summary: true
    registry_links: true
    notes: release-notes
    repos: [primary, github-mirror]  # dev release on gitlab AND github (mirror is git-only for refs)
    archives: stagefreight-binaries  # the same one recipe as release (OR-list when:)
    tag: "dev-{sha:8}"
    aliases: ["latest-dev"]
    type: prerelease
    retention:
      keep_last: 6   # latest-dev is rolling (no sequence var) → auto-exempt, no protect needed
    when: { branches: [main], events: [push] }

  # ── Documentation site → Cloudflare Pages ────────────────────────
  # Deploy the built docs-site tree to stagefreight.prplanit.com on version tags only, so
  # the mkdocs build that generates the site + the Cloudflare deploy run once per release
  # instead of on every main commit — no per-push churn or deploy-budget burn. Cloudflare
  # auto-wires DNS. Credentials: CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID.
  docs:
    kind: pages
    provider: cloudflare
    project: stagefreight
    build: docs-site
    domain: stagefreight.prplanit.com
    when: { git_tags: [stable], events: [tag] }

  # ── Documentation site → GitHub Pages (dogfood, alongside Cloudflare) ──
  # Force-pushes the same docs-site tree to the gh-pages branch of the GitHub mirror,
  # served at https://prplanit.github.io/StageFreight/. No custom domain — Cloudflare
  # owns stagefreight.prplanit.com. Requires GITHUB_TOKEN (contents:write) AND GitHub
  # Pages enabled on the repo with source = gh-pages branch.
  docs-github:
    kind: pages
    provider: github
    project_id: "{var:github_org}/{var:github_repo}"
    credentials: GITHUB
    build: docs-site
    when: { git_tags: [stable], events: [tag] }

build_cache:
  mode: hybrid
  external:
    registry: harbor
    path: "cache"
    fallback: "main"
  local:
    # Cap the BuildKit builder cache below the 15GB default — enforced by
    # `buildx prune --keep-storage` after each successful build. The runner's
    # 45GB disk is shared with the toolchain caches, and an uncapped builder cache
    # took it to 100%. NOTE: buildkitd is shared across projects on the runner, so
    # this only holds after a StageFreight build; for a uniform cap, match max_size
    # in the other projects' configs (or lower DefaultBuildCacheConfig).
    retention:
      max_age: "7d"
      max_size: "8GB"

commit:
  default_type: chore
  conventional: true
  backend: git

dependency:
  enabled: true
  output: ".stagefreight/deps"
  scope:
    go_modules: true
    dockerfile_env: true
  commit:
    enabled: true
    type: chore
    message: "update managed dependencies"
    push: true
    skip_ci: false

lint:
  level: full
  exclude:
    - "*.ttf"
    - "*.png"
    - "*.jpg"
    - "*.ico"
    - "*.woff"
    - "*.woff2"
  modules:
    freshness:
      enabled: true
      cache_ttl: 300
      sources:
        docker_images: true
        github_releases: true
        go_modules: true
      vulnerability:
        enabled: true
    tabs:
      enabled: true
    # House-style policy (default-off globally): StageFreight values output indirection
    # through the diag/renderer boundary, so it enables direct-output on ITS OWN source.
    direct-output:
      enabled: true
    secrets:
      enabled: true
      exclude:
        - "go.sum"
    conflicts:
      enabled: true
    filesize:
      enabled: true
    unicode:
      enabled: true
      # Unicode / invisible text defense — see docs/Linter.md § Unicode
      # No allowlist needed: banner art is build-generated with escaped
      # string literals (no raw control bytes in source).
      detect_bidi: true
      detect_zero_width: true
      detect_control_ascii: true

llms:
  # Model endpoint library — referenced by type: llm stencils via llm: <id>.
  # AI output is dispatch-only (stdout cards, notifications), never committed.
  glicynia: { provider: ollama, url: "http://glicynia:11434", model: "deepseek-r1:1.5b" }

notifications:
  # Phone pings via the in-cluster ntfy (delivery-bag). credentials: NTFY resolves
  # the NTFY_TOKEN CI variable (write-only token, topic StageFreight-CI).
  phone:
    provider: ntfy
    url: https://ntfy.pcfae.com/StageFreight-CI
    credentials: NTFY
  triage:
    provider: ntfy
    url: https://ntfy.pcfae.com/StageFreight-CI
    credentials: NTFY
    body: "{triage}"
    when: { outcomes: [failure] }
  recap:
    provider: ntfy
    url: https://ntfy.pcfae.com/StageFreight-CI
    credentials: NTFY
    body: "🤖 {recap}"
    when: { outcomes: [success] }

release:
  enabled: true

security:
  enabled: true
  output: ".stagefreight/security"
  sbom: true
  release_detail: full

# Tests run in audition (sibling to lint). The whole repo at gate: perform with
# -race: a failed suite fails audition → withholds the cistate artifact → halts
# perform + downstream (the same gate lint criticals use). git and the C toolchain
# (-race) are realized at TEST TIME via substrate (apk-backed, cached) — the shipped
# image stays git-less / minimal.
test:
  enabled: true
  suites:
    unit:
      tool: go
      packages: [./...]
      race: true
      coverage: true
      gate: perform

toolchains:
  want:
    trivy: "0.x"
    syft: "1.x"
    grype: "0.x"
    osv-scanner: "2.x"
    cosign: "3.x"
  retention:
    keep_last: 2

scribe:
  # files: one placement region per marked span. A region's body embeds stencils
  # by {id} (items: is sugar for a body).
  files:
    readme.project:
      file: "README.md"
      between: ["<!-- sf:project:start -->", "<!-- sf:project:end -->"]
      inline: true
      items: [repo-gh, repo-gl, license, issues, prs, contributors, donate, sponsor]

    readme.badges:
      file: "README.md"
      between: ["<!-- sf:badges:start -->", "<!-- sf:badges:end -->"]
      inline: true
      items: [release, build, go-version, go-reference, last-commit, stagefreight]

    # Multi-row (br): Row 1 = the registries, Row 2 = the release + dev tags.
    readme.image:
      file: "README.md"
      between: ["<!-- sf:image:start -->", "<!-- sf:image:end -->"]
      items: [ghcr, docker, pulls, harbor, br, release-latest, release-updated, release-size, dev-latest, dev-updated, dev-size]

    readme.contents.base:
      file: "README.md"
      between: ["<!-- sf:contents-base:start -->", "<!-- sf:contents-base:end -->"]
      items: [contents-base]

    readme.contents.apk:
      file: "README.md"
      between: ["<!-- sf:contents-apk:start -->", "<!-- sf:contents-apk:end -->"]
      items: [contents-apk]

    cli.reference:
      file: "docs/reference/CLI.md"
      between: ["<!-- sf:cli-reference:start -->", "<!-- sf:cli-reference:end -->"]
      items: [cli-reference]

    config.reference:
      file: "docs/reference/Config.md"
      between: ["<!-- sf:config-reference:start -->", "<!-- sf:config-reference:end -->"]
      items: [config-reference]

  commit:
    type: docs
    message: "refresh generated docs and badges"
    add:
      - "README.md"
      - "docs/assets/modules"
      - "docs/reference"
      - ".stagefreight/scribe"
    push: true
    # StageFreight's own docs are project metadata, not build inputs (the image
    # is built from src/ only — README/docs are never copied in), so the docs
    # auto-commit is synchronization output, not new source intent. Marking it
    # skip-ci keeps it from entering the lifecycle and spawning a follow-up
    # pipeline that auto-cancels the scribe which produced it. (Repos that ship docs IN
    # the image — e.g. FAIRER-pages — keep this false: there a docs change is a
    # real build input.) Broader X-StageFreight-Generated-keyed policy is TODO.
    skip_ci: true

# Identity for the fact-based stencils below: {path.ghcr}, {path.github},
# {slug.lower} and {stagefreight.version} resolve from here.
orgs:
  PrPlanIT:
    maintainer: "PrPlanIT <precisionplanit@gmail.com>"
    aliases:
      handle: prplanit
      github: PrPlanIT
      docker: prplanit
      ghcr: prplanit

metadata:
  org: PrPlanIT
  title: "StageFreight"
  license: BSD-3-Clause
  category: ci

stencils:
  # Copies of MaintenancePolicy preset/stencils-*.yml. StageFreight is not in the
  # catalog on purpose: the tool that applies governance must not need governance to
  # build, or a bad policy push would leave nothing able to fix it. The cost is that
  # these are copies and drift is paid for by hand — keep them identical.
  #
  # The shared audience-text library: define each renderable once (id → SOURCE type ×
  # RENDER render). Inline defs (no type) render a badge (default) or a shield
  # (render: shield); named producers (props/contents/include) render through the
  # matching module. Embed as {id} in a scribe files body, narrate, or a release body.

  # ── generated badges (SVG rendered from build metadata) ──
  release:
    label: release
    message: "v{base}"
    color: "#74ecbe"
    font: dejavu-sans
    font_size: 11
    link: "https://github.com/{path.github}/releases"
  build:
    label: build
    message: "{env:BUILD_STATUS}"
    color: auto
    font: monofur
    link: "https://gitlab.prplanit.com/{path.gitlab}/-/pipelines"
  license:
    label: license
    message: "{metadata.license}"
    color: "#310937"
    font: monofur
    link: LICENSE
  pulls:
    label: pulls
    message: "{registry.dockerhub.pulls}"
    color: "#1d63ed"
    link: "https://hub.docker.com/r/{path.dockerhub}"
  release-latest:
    label: latest
    message: "v{base}"
    color: "#74ecbe"
    font: dejavu-sans
    font_size: 11
    link: "https://github.com/{path.github}/pkgs/container/{slug.lower}"
  release-updated:
    label: updated
    message: "{registry.ghcr.tag.v{base}.updated}"
    color: "#236144"
    font: dejavu-sans
    font_size: 11
  release-size:
    label: size
    message: "{registry.ghcr.tag.v{base}.size}"
    color: "#555"
    font: dejavu-sans
    font_size: 11
    link: "https://github.com/{path.github}/pkgs/container/{slug.lower}"
  dev-latest:
    label: latest-dev
    message: "dev-{sha:8}"
    color: "#3b82f6"
    font: dejavu-sans
    font_size: 11
    link: "https://github.com/{path.github}/pkgs/container/{slug.lower}"
  dev-updated:
    label: updated
    message: "{registry.ghcr.tag.latest-dev.updated}"
    color: "#236144"
    font: dejavu-sans
    font_size: 11
  dev-size:
    label: size
    message: "{registry.ghcr.tag.latest-dev.size}"
    color: "#555"
    font: dejavu-sans
    font_size: 11
    link: "https://github.com/{path.github}/pkgs/container/{slug.lower}"

  # ── inline shields (shields.io draws from the composed verbs; no %2F juggling) ──
  repo-gh: { render: shield, label: GitHub, message: mirror, color: "#181717", logo: github, link: "https://github.com/{path.github}" }
  repo-gl: { render: shield, label: GitLab, message: source, color: "#FC6D26", logo: gitlab, link: "https://gitlab.prplanit.com/{path.gitlab}" }
  donate:  { render: shield, message: donate,  color: "#FF5E5B", logo: ko-fi,          logo_color: white, link: "https://ko-fi.com/T6T41IT163" }
  sponsor: { render: shield, message: sponsor, color: "#EA4AAA", logo: githubsponsors, logo_color: white, link: "https://github.com/sponsors/{org.github}" }
  ghcr:    { render: shield, label: GHCR,   message: "{path.ghcr}",      color: "#181717", logo: github, logo_color: white, link: "https://github.com/{path.github}/pkgs/container/{slug.lower}" }
  docker:  { render: shield, label: Docker, message: "{path.dockerhub}", color: "#2496ED", logo: docker, logo_color: white, link: "https://hub.docker.com/r/{path.dockerhub}" }
  harbor:  { render: shield, label: Harbor, message: "{path.harbor}",    color: "#60b932", link: "https://cr.pcfae.com/harbor/projects" }
  stagefreight: { render: shield, label: StageFreight, message: "{stagefreight.version}", color: "#310937", logo: readthedocs, logo_color: white, link: "https://stagefreight.prplanit.com" }

  # ── named producers · repo/module resolve from repos: publish-origin (github-mirror); no params ──
  go-version:   { type: go-version }
  go-reference: { type: go-reference }
  last-commit:  { type: github-last-commit }
  issues:       { type: github-issues-open }
  prs:          { type: github-prs-open }
  contributors: { type: github-contributors }


  # ── build-contents (rendered from a build's manifest inventory) ──
  contents-base:
    type: contents
    build: stagefreight
    section: inventories.versions
    render: badges
  contents-apk:
    type: contents
    build: stagefreight
    section: inventories.apk
    render: badges

  # ── includes (verbatim generated-module files) ──
  cli-reference:
    type: include
    path: docs/assets/modules/cli-reference.md
  config-reference:
    type: include
    path: docs/assets/modules/config-reference.md

  # ── AI triage (failure-gated notification body; lazy — ollama is only called
  #    when a failing run dispatches it) ──
  ci-detail:
    type: text
    body: |
      {commit_title}
      {status} · {project} {ref}
      Failed in {failure.subsystem} — {failure.reason}
      {failures}
      {vulns}
      Tests {tests.passed}/{tests.total} · coverage {tests.coverage}
      Commits since {changelog.range} — {changelog.count}
  triage:
    type: llm
    llm: glicynia
    body: |
      {ci-detail}

      In 2-3 sentences: what broke, the likely cause, and the first thing to check.
  recap:
    type: llm
    llm: glicynia
    body: |
      {summary}

      In one or two sentences, recap this CI run for a team chat — plain and direct,
      lead with what shipped. No markdown, no preamble.

  # ── release notes body (matches the shipped default, stated explicitly) ──
  release-notes:
    type: text
    body: |
      ## 📦 {project} — `v{version}`
      > **Release type:** {release.type} • **Commit:** `{sha}`

      **Security:** {release.security-tile}

      {release.images}
      {release.downloads}
      {release.verification}
      {release.highlights}
      {release.changes}
      {release.security}
      ---

      <details>
      <summary>Full changelog</summary>

      {release.changelog}

      </details>
      