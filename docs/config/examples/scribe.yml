# Scribe — generate README content and commit it.
# content: define renderables once (inline badge, inline shield, or a `type:` producer).
# files:   an id → region map; each region's items reference content by id.
version: 1

vars:
  org: myorg
  repo: myapp

builds:
  myapp:
    kind: docker

publish:
  dockerhub:
    kind: registry
    build: myapp
    url: docker.io
    path: "{var:org}/{var:repo}"
    tags: ["{version}", "latest"]
    credentials: DOCKER

scribe:
  content:
    # inline badge — a local SVG you own
    release:
      label: release
      message: "v{base}"
      color: "#74ecbe"
      output: ".stagefreight/badges/release.svg"
      link: "https://github.com/{var:org}/{var:repo}/releases"
    # inline shield — composed from fields (no %2F juggling)
    docker: { render: shield, label: Docker, message: "{var:org}/{var:repo}", color: "#2496ED", logo: docker, link: "https://hub.docker.com/r/{var:org}/{var:repo}" }
  files:
    readme-badges:
      file: "README.md"
      between: ["<!-- sf:badges:start -->", "<!-- sf:badges:end -->"]
      mode: replace
      inline: true
      items: [release, docker]
  commit:
    type: docs
    message: "refresh generated badges"
    add: [".stagefreight/badges", "README.md"]
