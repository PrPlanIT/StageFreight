# Two-pass crucible build mode — self-proving rebuild.
version: 1

builds:
  myapp:
    kind: docker
    build_mode: crucible
    platforms: [linux/amd64]

publish:
  dockerhub:
    kind: registry
    build: myapp
    url: docker.io
    path: myorg/myapp
    tags: ["{version}", "latest"]
    when: { events: [tag] }
    credentials: DOCKER
